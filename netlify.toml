[build]
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon/favicon.svg"
  status = 200
  force = true

[[edge_functions]]
  path = "/_scalar/*"
  function = "scalar-internal"

[[edge_functions]]
  path = "/multi_search"
  function = "multi-search"
